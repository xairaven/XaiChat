[package]
name = "server"
version = "0.0.1"
authors = ["Oleksandr Kovalov <oleksandr.kovalov.work@gmail.com>"]

edition = "2024"
rust-version = "1.95"

categories = ["web-programming"]

readme = "../README.md"
license = "MIT"
repository = "https://github.com/xairaven/XaiChat"

[lints]
workspace = true

[dependencies]
protocol = { path = "../protocol" }

anyhow = "1.0.102"
bytes = "1.11.1"
dotenvy = "0.15.7"
futures = "0.3.32"
postcard = { version = "1.1.3", features = ["use-std"] }
sqlx = { version = "0.8.6" , features = ["runtime-tokio-rustls", "postgres", "chrono"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
