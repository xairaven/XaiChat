[package]
name = "client"
version = "0.0.1"
authors = ["Oleksandr Kovalov <oleksandr.kovalov.work@gmail.com>"]

edition = "2024"
rust-version = "1.95"

categories = ["web-programming"]

readme = "../README.md"
license = "MIT"
repository = "https://github.com/xairaven/XaiChat"

[lints]
workspace = true

[dependencies]
protocol = { path = "../protocol" }

bytes = "1.11.1"
chrono = "0.4.44"
crossbeam = "0.8.4"
egui = "0.34.1"
egui-phosphor = "0.12.0"
eframe = { version = "0.34.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
fern = "0.7.1"
futures = "0.3.32"
log = "0.4.29"
o2o = "0.5.4"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.1"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
toml = "1.1.2"
